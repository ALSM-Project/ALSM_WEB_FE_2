name: Deploy ALSM Staff Portal to AWS EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alsm-ec2-staff
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate public production URLs
        env:
          USER_URL: ${{ vars.ALSM_USER_URL }}
          STAFF_URL: ${{ vars.ALSM_STAFF_URL }}
          WEB3_URL: ${{ vars.ALSM_WEB3_URL }}
        run: |
          set -euo pipefail
          for value in "$USER_URL" "$STAFF_URL" "$WEB3_URL"; do
            if [[ "$value" != https://* ]]; then
              echo "::error::Set ALSM_USER_URL, ALSM_STAFF_URL and ALSM_WEB3_URL in GitHub Actions Variables."
              exit 1
            fi
          done
      - name: Lint, test and build production
        env:
          VITE_API_BASE_URL: ${{ vars.ALSM_STAFF_URL }}
          VITE_USER_PORTAL_URL: ${{ vars.ALSM_USER_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: alsm-staff-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # Dedicated, non-root EC2 runner. No inbound SSH from GitHub required.
    runs-on: [self-hosted, linux, x64, alsm-deploy]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: alsm-staff-dist
          path: dist
      - name: Activate immutable release, smoke-test and roll back if needed
        env:
          SITE_URL: ${{ vars.ALSM_STAFF_URL }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="/var/www/alsm/releases/staff"
          RELEASE="$BASE/$REVISION"
          test -L "$BASE/current" || { echo "::error::EC2 portal bootstrap incomplete"; exit 1; }
          test -s dist/index.html
          PREVIOUS="$(readlink "$BASE/current")"
          mkdir -p "$RELEASE"
          rsync -rlt --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r dist/ "$RELEASE/"
          test -s "$RELEASE/index.html"
          ln -sfn "$RELEASE" "$BASE/.current-next"
          mv -Tf "$BASE/.current-next" "$BASE/current"
          if ! curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/" -o /dev/null; then
            echo "::error::HTTPS health check failed; restoring prior release"
            ln -sfn "$PREVIOUS" "$BASE/.current-next"
            mv -Tf "$BASE/.current-next" "$BASE/current"
            exit 1
          fi
          echo "Deployed staff portal: $REVISION"
